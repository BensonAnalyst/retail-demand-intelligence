# Databricks Asset Bundle: deploy with
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run retail_demand_pipeline -t dev
bundle:
  name: retail-demand-intelligence

variables:
  catalog:
    default: workspace
  schema:
    default: retail_ds

resources:
  jobs:
    retail_demand_pipeline:
      name: retail-demand-intelligence-pipeline
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: bronze
          notebook_task: { notebook_path: ./notebooks/01_bronze_ingest.py }
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task: { notebook_path: ./notebooks/02_silver_quality_eda.py }
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task: { notebook_path: ./notebooks/03_gold_features.py }
        - task_key: forecast
          depends_on: [{ task_key: gold }]
          notebook_task: { notebook_path: ./notebooks/04_forecast_backtest_mlflow.py }
        - task_key: inventory
          depends_on: [{ task_key: forecast }]
          notebook_task: { notebook_path: ./notebooks/05_inventory_optimization.py }
        - task_key: pricing
          depends_on: [{ task_key: gold }]
          notebook_task: { notebook_path: ./notebooks/06_pricing_promo_analytics.py }
        - task_key: monitoring
          depends_on: [{ task_key: inventory }, { task_key: pricing }]
          notebook_task: { notebook_path: ./notebooks/07_monitoring_business_impact.py }
      # no cluster block -> runs on serverless jobs compute (works on Free Edition)
      schedule:
        quartz_cron_expression: "0 0 22 ? * SUN"
        timezone_id: Asia/Singapore
        pause_status: PAUSED

targets:
  dev:
    mode: development
    default: true
